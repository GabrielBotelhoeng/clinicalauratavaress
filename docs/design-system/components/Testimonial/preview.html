<!doctype html>
<html lang="pt-BR">
<head>
<link rel="stylesheet" href="../../tokens.css">
<link rel="stylesheet" href="../bundle.css"><meta charset="utf-8"><title>Testimonial</title>
<style>html,body{margin:0;background:var(--surface)} body{padding:24px}</style></head>
<body class="lt">
<div style="display:grid;grid-template-columns:repeat(2,1fr);gap:24px;background:var(--surface-blush);padding:32px;border-radius:var(--radius-lg)">
  <figure class="lt-card" style="margin:0">
    <div style="color:var(--gold);letter-spacing:4px">★★★★★</div>
    <blockquote class="lt-title" style="font-size:24px;font-style:italic;font-weight:400;line-height:1.35;margin:16px 0 24px">"Fiquei mais descansada e ninguém percebeu que fiz algo — só que eu estava mais bonita."</blockquote>
    <figcaption style="display:flex;align-items:center;gap:12px"><span style="width:44px;height:44px;border-radius:50%;background:var(--surface-rose)"></span><span><b style="font:500 14px/1.2 var(--font-sans)">Nome da paciente</b><br><span class="lt-caption">Rejuvenescimento 40+</span></span></figcaption>
  </figure>
  <figure class="lt-card" style="margin:0">
    <div style="color:var(--gold);letter-spacing:4px">★★★★★</div>
    <blockquote class="lt-title" style="font-size:24px;font-style:italic;font-weight:400;line-height:1.35;margin:16px 0 24px">"O atendimento é de outro nível. A Dra. explicou cada etapa antes de qualquer procedimento."</blockquote>
    <figcaption style="display:flex;align-items:center;gap:12px"><span style="width:44px;height:44px;border-radius:50%;background:var(--surface-rose)"></span><span><b style="font:500 14px/1.2 var(--font-sans)">Nome da paciente</b><br><span class="lt-caption">Harmonização facial</span></span></figcaption>
  </figure>
</div>
<script></script>
</body>
</html>
