<!-- @dsCard height=300 -->
<!doctype html>
<html lang="pt-BR">
<head>
<link rel="stylesheet" href="../../tokens.css">
<link rel="stylesheet" href="../bundle.css">
<meta charset="utf-8">
<title>Clínica Laura Tavares</title>
<style>
  html, body { margin:0; height:100%; }
  body { background:var(--surface); color:var(--ink); font-family:var(--font-sans); overflow:hidden; }
  .cover { position:relative; height:300px; overflow:hidden; }
  .band { position:absolute; left:0; top:0; width:960px; height:112px; }
  .band svg { display:block; width:960px; height:112px; }
  .rosewood { fill:var(--brand-rosewood); }
  .blush { fill:var(--brand-blush); }
  .rose { fill:var(--brand-rose); }
  .champ { fill:var(--brand-champagne); }
  .espresso { fill:var(--brand-espresso); }
  .rouge { fill:var(--brand-rouge); }
  .words { position:absolute; left:var(--space-8); right:var(--space-8); bottom:var(--space-8); }
  .name { margin:0; font-family:var(--font-serif); font-size:64px; line-height:.95; font-weight:500; letter-spacing:-.01em; color:var(--ink); }
  .name em { font-style:italic; color:var(--accent); }
  .tag { margin:var(--space-3) 0 0 2px; font-size:14px; line-height:20px; color:var(--ink-muted); max-width:440px; }
</style>
</head>
<body>
<div class="cover">
<div class="band" aria-hidden="true">
<svg viewBox="0 0 960 112" width="960" height="112">
<!--
  blocks      brand-blush 288 wide (the clinic wall, largest) · brand-rosewood 192 · brand-champagne 96 · brand-espresso 240 · brand-rose 144 · brand-rouge 16-wide sliver once (the lipstick accent, used once per page) — full-width band 112 tall ≈ 37% of 960×300
  arrangement a strip of unequal bands bleeding off the top, read left→right as wall · action · gold · night · rosé
  pattern     literal motif row: the ARCH (radius-arch on the top corners only) — the photo frame that IS this brand — cut as arches rising from the band's base, ground and block colours
  scales      arch width space-12 (48) and space-16 (64), gaps space-6 (24), arch top = half its width (radius-arch clamps to a semicircle); blocks sized in space-12 multiples
-->
  <rect class="blush" x="0" y="0" width="288" height="112"/>
  <rect class="rosewood" x="288" y="0" width="192" height="112"/>
  <rect class="champ" x="480" y="0" width="96" height="112"/>
  <rect class="espresso" x="576" y="0" width="240" height="112"/>
  <rect class="rose" x="816" y="0" width="144" height="112"/>
  <rect class="rouge" x="800" y="0" width="16" height="112"/>
  <!-- arches on the blush wall (rosé) -->
  <path class="rose" d="M24 112V56a32 32 0 0 1 64 0v56z"/>
  <path class="rose" d="M112 112V56a32 32 0 0 1 64 0v56z"/>
  <path class="rosewood" d="M200 112V56a32 32 0 0 1 64 0v56z"/>
  <!-- arches on rosewood (blush) -->
  <path class="blush" d="M336 112V64a24 24 0 0 1 48 0v48z"/>
  <!-- arch on gold (espresso) -->
  <path class="espresso" d="M504 112V64a24 24 0 0 1 48 0v48z"/>
  <!-- arches on espresso (champagne + blush) -->
  <path class="champ" d="M600 112V56a32 32 0 0 1 64 0v56z"/>
  <path class="blush" d="M688 112V56a32 32 0 0 1 64 0v56z"/>
  <!-- arch on rosé (porcelain cut) -->
  <path class="blush" d="M864 112V64a24 24 0 0 1 48 0v48z"/>
</svg>
</div>
<div class="words">
  <h1 class="name">Clínica Laura Tavares</h1>
  <p class="tag">Estética avançada no Sudoeste — rejuvenescer sem deixar de ser você.</p>
</div>
</div>
</body>
</html>
