<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <title>OG — Clínica Laura Tavares</title>
    <style>
      @font-face {
        font-family: 'Cormorant Garamond';
        font-style: normal;
        font-weight: 500;
        src: url('/node_modules/@fontsource/cormorant-garamond/files/cormorant-garamond-latin-500-normal.woff2')
          format('woff2');
      }
      @font-face {
        font-family: 'Cormorant Garamond';
        font-style: italic;
        font-weight: 500;
        src: url('/node_modules/@fontsource/cormorant-garamond/files/cormorant-garamond-latin-500-italic.woff2')
          format('woff2');
      }
      @font-face {
        font-family: 'Jost';
        font-style: normal;
        font-weight: 400;
        src: url('/node_modules/@fontsource/jost/files/jost-latin-400-normal.woff2') format('woff2');
      }
      @font-face {
        font-family: 'Jost';
        font-style: normal;
        font-weight: 500;
        src: url('/node_modules/@fontsource/jost/files/jost-latin-500-normal.woff2') format('woff2');
      }
      @font-face {
        font-family: 'Pinyon Script';
        font-style: normal;
        font-weight: 400;
        src: url('/node_modules/@fontsource/pinyon-script/files/pinyon-script-latin-400-normal.woff2')
          format('woff2');
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      html,
      body {
        width: 1200px;
        height: 630px;
        overflow: hidden;
      }

      body {
        position: relative;
        display: grid;
        grid-template-columns: 7fr 5fr;
        align-items: center;
        background: radial-gradient(120% 120% at 18% 20%, #fbf6f2 0%, #f1dcd6 55%, #ebcbc3 100%);
        font-family: 'Jost', sans-serif;
      }

      .copy {
        display: grid;
        gap: 20px;
        padding: 64px 0 64px 72px;
      }

      .eyebrow {
        font:
          500 15px/1 'Jost',
          sans-serif;
        letter-spacing: 0.26em;
        text-transform: uppercase;
        color: #8c4a55;
      }

      .title {
        font:
          500 54px/1.08 'Cormorant Garamond',
          serif;
        color: #33241f;
        max-width: 560px;
      }

      .title em {
        font-style: italic;
        color: #8c4a55;
      }

      .signature {
        margin-top: 12px;
        font:
          400 42px/1 'Pinyon Script',
          cursive;
        color: #8c4a55;
      }

      .photo-frame {
        position: relative;
        height: 520px;
        margin: 0 48px 0 0;
        border-radius: 260px / 300px;
        overflow: hidden;
        box-shadow: 0 24px 60px rgba(140, 74, 85, 0.25);
      }

      .photo-frame img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        object-position: center 20%;
      }
    </style>
  </head>
  <body>
    <div class="copy">
      <p class="eyebrow">Clínica Laura Tavares — Estética Avançada</p>
      <p class="title">Rejuvenescer sem deixar de <em>ser você.</em></p>
      <p class="signature">Laura Tavares</p>
    </div>
    <div class="photo-frame">
      <img src="/og/photo.jpg" alt="" />
    </div>
  </body>
</html>
